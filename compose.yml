# Local/prod run: `docker compose up -d --build`, then http://localhost:8080
services:
  campus:
    build: .
    image: younes-campus:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
